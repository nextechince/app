name: Build LUMA CHAT

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 1 — Ensure a release keystore exists (generate + commit if missing)
      # ═══════════════════════════════════════════════════════════════════════
      - name: Ensure release keystore exists
        run: |
          mkdir -p /tmp/backup

          if [ -f android/app/luma-release.jks ] && [ -f android/key.properties ]; then
            echo "✅ Keystore already exists in repo — backing up"
            cp android/app/luma-release.jks /tmp/backup/luma-release.jks
            cp android/key.properties /tmp/backup/key.properties
          else
            echo "⚠️ Keystore missing — generating fresh"

            mkdir -p android/app

            keytool -genkeypair -v \
              -keystore /tmp/backup/luma-release.jks \
              -alias luma \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass luma12345 \
              -keypass luma12345 \
              -dname "CN=Luma Chat, OU=Mobile, O=Luma, L=London, ST=London, C=GB"

            cat > /tmp/backup/key.properties << 'EOF'
          storePassword=luma12345
          keyPassword=luma12345
          keyAlias=luma
          storeFile=luma-release.jks
          EOF

            cp /tmp/backup/luma-release.jks android/app/luma-release.jks
            cp /tmp/backup/key.properties android/key.properties

            git config user.name "Luma Chat CI"
            git config user.email "actions@github.com"
            git add -f android/app/luma-release.jks android/key.properties
            git commit -m "Add release signing keystore [skip ci]" || echo "nothing to commit"
            git push || echo "push failed — continuing anyway"

            echo "✅ Keystore generated and committed"
          fi

          ls -la /tmp/backup/

      - name: Backup keystore + google-services.json
        run: |
          mkdir -p /tmp/backup
          cp android/app/google-services.json /tmp/google-services.json
          cp android/app/luma-release.jks /tmp/backup/luma-release.jks
          cp android/key.properties /tmp/backup/key.properties
          echo "=== Backed up ==="
          ls -la /tmp/backup/

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 2 — Create fresh Android project + restore critical files
      # ═══════════════════════════════════════════════════════════════════════
      - name: Create Android project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.lumachat --project-name app
          mkdir -p android/app
          cp /tmp/google-services.json android/app/google-services.json
          cp /tmp/backup/luma-release.jks android/app/luma-release.jks
          cp /tmp/backup/key.properties android/key.properties
          echo "=== Restored files ==="
          ls -la android/app/google-services.json
          ls -la android/app/luma-release.jks
          ls -la android/key.properties

      - name: Fix settings.gradle
        run: |
          cat > android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "7.4.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.10" apply false
              id "com.google.gms.google-services" version "4.3.15" apply false
          }

          include ":app"
          EOF

      - name: Fix project-level build.gradle
        run: |
          cat > android/build.gradle << 'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                      }
                  }
              }
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

      - name: Fix Gradle wrapper
        run: |
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-7.6.3-all.zip
          EOF

      - name: Fix gradle.properties
        run: |
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          android.enableR8.fullMode=false
          android.enableR8=true
          android.enableDexingArtifactTransform=true
          kotlin.jvm.target.validation.mode=warning
          android.suppressUnsupportedCompileSdk=34
          EOF

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 3 — Config files
      # ═══════════════════════════════════════════════════════════════════════
      - name: Create Cloudinary config
        run: |
          cat > lib/services/cloudinary_config.dart << 'EOF'
          class CloudinaryConfig {
            static const String cloudName = '${{ secrets.CLOUDINARY_CLOUD_NAME }}';
            static const String apiKey = '${{ secrets.CLOUDINARY_API_KEY }}';
            static const String apiSecret = '${{ secrets.CLOUDINARY_API_SECRET }}';
          }
          EOF

      - name: Create API config with Gemini key
        run: |
          cat > lib/services/api_config.dart << 'EOF'
          class ApiConfig {
            static const String geminiApiKey = '${{ secrets.GEMINI_API_KEY }}';
          }
          EOF

      - name: Create EmailJS config
        run: |
          cat > lib/services/emailjs_config.dart << 'EOF'
          class EmailJSConfig {
            static const String serviceId = '${{ secrets.EMAILJS_SERVICE_ID }}';
            static const String templateId = '${{ secrets.EMAILJS_TEMPLATE_ID }}';
            static const String publicKey = '${{ secrets.EMAILJS_PUBLIC_KEY }}';
          }
          EOF

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 4 — Configure build.gradle with release signing
      # ═══════════════════════════════════════════════════════════════════════
      - name: Fix app build.gradle for ALL phones
        run: |
          python3 << 'PYEOF'
          import re

          with open('android/app/build.gradle', 'r') as f:
              content = f.read()

          content = re.sub(r'namespace\s+"[^"]*"', 'namespace "com.lumachat.app"', content)
          content = re.sub(r'applicationId\s+"[^"]*"', 'applicationId "com.lumachat.app"', content)

          content = re.sub(r'compileSdk\s*=?\s*flutter\.compileSdkVersion', 'compileSdk = 34', content)
          content = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 34', content)
          content = re.sub(r'compileSdk\s*=?\s*\d+', 'compileSdk = 34', content)
          content = re.sub(r'targetSdk\s*=?\s*flutter\.targetSdkVersion', 'targetSdk = 34', content)
          content = re.sub(r'targetSdkVersion\s+.*', 'targetSdkVersion 34', content)
          content = re.sub(r'targetSdk\s*=?\s*\d+', 'targetSdk = 34', content)
          content = re.sub(r'minSdk\s*=?\s*flutter\.minSdkVersion', 'minSdk = 21', content)
          content = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 21', content)

          if 'com.google.gms.google-services' not in content:
              content = content.replace(
                  'plugins {',
                  'plugins {\n    id "com.google.gms.google-services"'
              )

          signing_block = """
              def keystoreProperties = new Properties()
              def keystorePropertiesFile = rootProject.file('key.properties')
              if (keystorePropertiesFile.exists()) {
                  keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
              }

              signingConfigs {
                  release {
                      if (keystorePropertiesFile.exists()) {
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                      }
                  }
              }

              buildTypes {
                  release {
                      if (keystorePropertiesFile.exists()) {
                          signingConfig signingConfigs.release
                      } else {
                          signingConfig signingConfigs.debug
                      }
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          """

          content = re.sub(
              r'buildTypes\s*\{[^}]*release\s*\{[^}]*\}[^}]*\}',
              signing_block,
              content,
              flags=re.DOTALL
          )

          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          PYEOF

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 5 — MainActivity with native voice recorder (no `record` package)
      # ═══════════════════════════════════════════════════════════════════════
      - name: Force MainActivity with native recorder
        run: |
          mkdir -p android/app/src/main/kotlin/com/lumachat/app
          cat > android/app/src/main/kotlin/com/lumachat/app/MainActivity.kt << 'EOF'
          package com.lumachat.app

          import android.media.MediaRecorder
          import android.os.Build
          import io.flutter.embedding.android.FlutterFragmentActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File

          class MainActivity : FlutterFragmentActivity() {

              private val CHANNEL = "com.lumachat.app/recorder"
              private var recorder: MediaRecorder? = null
              private var currentPath: String? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "start" -> {
                                  val path = call.argument<String>("path")
                                  if (path == null) {
                                      result.error("NO_PATH", "path is null", null)
                                      return@setMethodCallHandler
                                  }
                                  try {
                                      startRecording(path)
                                      result.success(true)
                                  } catch (e: Exception) {
                                      result.error("START_FAILED", e.message, null)
                                  }
                              }
                              "stop" -> {
                                  try {
                                      val path = stopRecording()
                                      result.success(path)
                                  } catch (e: Exception) {
                                      result.error("STOP_FAILED", e.message, null)
                                  }
                              }
                              "cancel" -> {
                                  try {
                                      cancelRecording()
                                      result.success(true)
                                  } catch (e: Exception) {
                                      result.error("CANCEL_FAILED", e.message, null)
                                  }
                              }
                              else -> result.notImplemented()
                          }
                      }
              }

              private fun startRecording(path: String) {
                  try {
                      recorder?.release()
                  } catch (_: Exception) {}
                  recorder = null

                  val file = File(path)
                  file.parentFile?.mkdirs()

                  recorder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      MediaRecorder(this)
                  } else {
                      @Suppress("DEPRECATION")
                      MediaRecorder()
                  }.apply {
                      setAudioSource(MediaRecorder.AudioSource.MIC)
                      setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)
                      setAudioEncoder(MediaRecorder.AudioEncoder.AAC)
                      setAudioEncodingBitRate(128000)
                      setAudioSamplingRate(44100)
                      setOutputFile(path)
                      prepare()
                      start()
                  }
                  currentPath = path
              }

              private fun stopRecording(): String? {
                  val path = currentPath
                  try {
                      recorder?.stop()
                  } catch (_: Exception) {
                  } finally {
                      try {
                          recorder?.release()
                      } catch (_: Exception) {}
                      recorder = null
                      currentPath = null
                  }
                  return path
              }

              private fun cancelRecording() {
                  try {
                      recorder?.stop()
                  } catch (_: Exception) {
                  } finally {
                      try {
                          recorder?.release()
                      } catch (_: Exception) {}
                      recorder = null
                  }
                  currentPath?.let {
                      val f = File(it)
                      if (f.exists()) f.delete()
                  }
                  currentPath = null
              }

              override fun onDestroy() {
                  try {
                      recorder?.release()
                  } catch (_: Exception) {}
                  recorder = null
                  super.onDestroy()
              }
          }
          EOF

      - name: Create ProGuard rules
        run: |
          cat > android/app/proguard-rules.pro << 'EOF'
          -keep class io.flutter.app.** { *; }
          -keep class io.flutter.plugin.** { *; }
          -keep class io.flutter.util.** { *; }
          -keep class io.flutter.view.** { *; }
          -keep class io.flutter.** { *; }
          -keep class io.flutter.plugins.** { *; }
          -keep class androidx.lifecycle.** { *; }
          -keep class com.google.firebase.** { *; }
          -keep class com.google.android.gms.** { *; }
          -keep class io.agora.** { *; }
          -dontwarn io.agora.**
          -keep class com.cloudinary.** { *; }
          -dontwarn com.cloudinary.**
          -keep class okhttp3.** { *; }
          -keep class retrofit2.** { *; }
          -dontwarn retrofit2.**
          -keepclassmembers class * {
              @com.google.gson.annotations.SerializedName <fields>;
          }

          -keep class androidx.exifinterface.** { *; }
          -dontwarn androidx.exifinterface.**
          -keep class com.fluttercandies.photo_manager.** { *; }
          -dontwarn com.fluttercandies.photo_manager.**

          -dontwarn kotlin.**
          -dontwarn kotlinx.**
          -keep class kotlin.** { *; }
          -keep class kotlinx.** { *; }

          -keepattributes SourceFile,LineNumberTable
          -renamesourcefileattribute SourceFile
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-sdk tools:overrideLibrary="com.google.firebase.auth" />

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.ACCESS_MEDIA_LOCATION" />

              <application
                  android:label="Luma Chat"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:fullBackupContent="true"
                  android:largeHeap="true"
                  android:hardwareAccelerated="true"
                  android:extractNativeLibs="true"
                  android:requestLegacyExternalStorage="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.BROWSABLE"/>
                          <data android:scheme="https"
                                android:host="lumachat.app"
                                android:pathPrefix="/invite"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.BROWSABLE"/>
                          <data android:scheme="luma"
                                android:host="invite"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name="com.google.firebase.messaging.FirebaseMessagingService"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT"/>
                      </intent-filter>
                  </service>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />

                  <meta-data
                      android:name="com.google.firebase.messaging.default_notification_channel_id"
                      android:value="luma_chat_channel"/>
              </application>
          </manifest>
          EOF

      - name: Create asset directories
        run: mkdir -p assets/images assets/emojis assets/audio

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 6 — Fetch dependencies and build
      # ═══════════════════════════════════════════════════════════════════════
      - name: Flutter pub get
        run: flutter pub get

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: luma-chat-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-*-release.apk"
          tag: v${{ github.run_number }}
          name: "Luma Chat v${{ github.run_number }}"
          body: "Luma Chat - Works on all Android 5.0+ phones"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
