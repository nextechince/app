name: Generate Keystore (Run once)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate release keystore
        run: |
          mkdir -p android/app
          
          keytool -genkeypair -v \
            -keystore android/app/luma-release.jks \
            -alias luma \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass luma12345 \
            -keypass luma12345 \
            -dname "CN=Luma Chat, OU=Mobile, O=Luma, L=Doha, ST=Qatar, C=QA"

          cat > android/key.properties << 'EOF'
          storePassword=luma12345
          keyPassword=luma12345
          keyAlias=luma
          storeFile=luma-release.jks
          EOF

          echo "=== Keystore created ==="
          ls -la android/app/luma-release.jks
          echo "=== key.properties ==="
          cat android/key.properties

      - name: Commit keystore to repo
        run: |
          git config user.name "Luma Chat CI"
          git config user.email "actions@github.com"
          git add android/app/luma-release.jks android/key.properties
          git commit -m "Add release signing keystore"
          git push
